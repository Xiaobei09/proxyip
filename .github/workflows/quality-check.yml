name: Quality check

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"

permissions:
  contents: write

concurrency:
  group: quality-check
  cancel-in-progress: true

jobs:
  check:
    name: Streaming and exit IP quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ABUSEIPDB_KEY: ${{ secrets.ABUSEIPDB_KEY }}
      IPQS_KEY: ${{ secrets.IPQS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Deep quality check
        run: python scripts/quality_check.py --time-budget 1800

      - name: Generate stats and chart
        run: python scripts/generate_stats.py

      - name: Show summary
        run: |
          echo "Checked proxies:"
          wc -l data/valid/all_ltd.txt
          echo "Streaming unlock:"
          jq -r '.streaming // empty' data/valid/quality_meta.json 2>/dev/null || true
          echo "IP type distribution:"
          jq -r '.by_type // empty' data/valid/quality_meta.json 2>/dev/null || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -Af data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): streaming & exit IP quality check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $i failed, reapplying local data on origin/main..."
            git fetch origin main || { sleep 5; continue; }
            # data/ 每次全量重生成，last-writer-wins 安全：reset --mixed 把 HEAD 和
            # index 对齐到最新远端（工作区保留本次生成的数据），再重新 stage + commit
            # 为直接子提交，天然避免 -X theirs 无法解决的 modify/delete 等一切冲突。
            # 必须用 --mixed（而非 --soft）：--soft 只动 HEAD 不动 index，陈旧 checkout
            # 的 index 会连非 data 文件一起带进数据提交，回退他人已推送的代码改动。
            git reset --mixed origin/main
            git add -Af data/
            if git diff --cached --quiet; then
              echo "No changes to push"
              exit 0
            fi
            git commit -m "chore(data): streaming & exit IP quality check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          done
          echo "Push failed after 5 attempts"
          exit 1
