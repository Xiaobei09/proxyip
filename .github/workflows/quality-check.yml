name: Quality check

on:
  workflow_run:
    workflows: ["Update proxy list"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write

concurrency:
  group: quality-check
  cancel-in-progress: true

jobs:
  check:
    name: Streaming and exit IP quality
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ABUSEIPDB_KEY: ${{ secrets.ABUSEIPDB_KEY }}
      IPQS_KEY: ${{ secrets.IPQS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Deep quality check
        run: python scripts/quality_check.py --time-budget 1800

      - name: Generate stats and chart
        run: python scripts/generate_stats.py

      - name: Show summary
        run: |
          echo "Checked proxies:"
          wc -l data/valid/all_ltd.txt
          echo "Streaming unlock:"
          jq -r '.streaming // empty' data/valid/quality_meta.json 2>/dev/null || true
          echo "IP type distribution:"
          jq -r '.by_type // empty' data/valid/quality_meta.json 2>/dev/null || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): streaming & exit IP quality check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $i failed, rebasing on origin/main and retrying..."
            git fetch origin main || break
            # -X theirs: on conflict with concurrent data commits, prefer the
            # freshly generated data from this run (last-writer-wins is safe
            # because data/ is fully regenerated on every run).
            git rebase --autostash -X theirs origin/main || {
              echo "Rebase failed, aborting and retrying"
              git rebase --abort
            }
          done
          echo "Push failed after 5 attempts"
          exit 1
