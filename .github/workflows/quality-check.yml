name: Quality check

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update proxy list"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: quality-check
  cancel-in-progress: false

jobs:
  check:
    name: Streaming and exit IP quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ABUSEIPDB_KEY: ${{ secrets.ABUSEIPDB_KEY }}
      IPQS_KEY: ${{ secrets.IPQS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout PCB bundle (read-only, tracking main)
        uses: actions/checkout@v7
        with:
          repository: Xiaobei09/PCB
          ref: main
          token: ${{ secrets.BUNDLE_PAT }}
          path: pcb

      - name: Mark job start
        run: touch .jobstart

      - name: Skip if superseded or no data change
        id: gate
        run: |
          # 1. 竞态检查：有无正在运行/排队的同 workflow run
          LATEST=$(gh run list --workflow="${{ github.workflow }}" \
            --json=databaseId,status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")]
                   | sort_by(.databaseId) | last | .databaseId // empty' 2>/dev/null || echo "")
          if [ -n "$LATEST" ] && [ "$LATEST" != "${{ github.run_id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by run $LATEST, skipping"
            exit 0
          fi
          # 2. 触发者结论 → 只判「数据新不新鲜」，**不许关掉愈合链**。
          #    跨工作流 R325 I1：本工作流是 reorg_country.py 的唯一所有者
          #    （china-check.yml 成文「单一写入者」），而它只被
          #    update-proxies 成功触发。原写法在此置 skip=true ⇒ 整条愈合链
          #    skipped ⇒ all.txt/countries 漂移永无人愈 ⇒ 下一班
          #    update-proxies 起跑即红 ⇒ conclusion=failure ⇒ gate 又跳 ⇒
          #    跨工作流自指死锁，唯一解药只剩手动 dispatch（实测 R13/R29
          #    两次被迫救火）。漂移制造者是 china-check 的 reachability
          #    提交（写 all.txt+countries 但会漏归档端点），每小时一次。
          #    触发者失败时 download 也没跑、数据未变 ⇒ heal 链照跑（幂等），
          #    只用 stale 拦住 R254 的网络测量步，不白烧 90min 配额。
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            if [ "$CONCLUSION" != "success" ]; then
              echo "stale=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Triggering run concluded: $CONCLUSION → heal chain runs, network measurement skipped"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        if: steps.gate.outputs.skip != 'true'
        run: python -m unittest discover -s pcb/tests_pipeline -v

      - name: Deep quality check
        id: quality
        # R48：stale 只拦本网络测量步（触发者失败 ⇒ 数据未变 ⇒ 没有新探测
        # 对象）。愈合链 reorg/annotate/commit 刻意**不看** stale，否则
        # 触发者一红就没人修漂移，死锁复发。
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.stale != 'true'
        timeout-minutes: 110
        run: python pcb/scripts/quality_check.py --source data/valid/all.txt --time-budget 5400 --rep-cache-ttl 604800

      - name: Rolling uptime
        if: steps.gate.outputs.skip != 'true'
        run: python pcb/scripts/uptime.py

      - name: Reorganize by exit country
        # R325：heal 族。早测红时 views 重排被跳过 ⇒ 视图漂移无人修复。
        if: always() && steps.gate.outputs.skip != 'true'
        run: python pcb/scripts/reorg_country.py

      - name: Annotate and classify
        id: annotate
        # R325：heal 族（`→出口` 标注漂移与 views 收敛的唯一修复动作）。
        # 早测红时跳过它 ⇒ 漂移永久无人修复。
        if: always() && steps.gate.outputs.skip != 'true'
        run: python pcb/scripts/annotate_classify.py

      # good 清单改由专职 build-good 工作流在本链成功后重建（单一写入者）

      - name: Audit entry CC labels
        # R325：审计步。早测红时跳过就看不到本轮 CC 标注的审计结论。
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: python pcb/scripts/audit_entry_cc.py --timeout 20

      # 图表/统计改由专职 stats 工作流在本链成功后统一重建（单一写入者）

      - name: Show summary
        # R325：早测失败时也要能看到本轮统计。always() 不判绿 job。
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          echo "Checked proxies:"
          wc -l data/valid/all.txt
          echo "IP type distribution:"
          jq -r '.by_type // empty' data/quality/quality_meta.json 2>/dev/null || true

      - name: Commit changes
        # R325：`quality.outcome` 由 `== 'success'` 放宽为 `!= 'failure'`——
        # `Deep quality check` 是**网络测量步**（--time-budget 5400），按 R254
        # 刻意不加 always()（早测红就不烧 90min 配额）⇒ 早测红时它被 skip ⇒
        # 用 `== 'success'` 会让提交永不发生。真实探测失败仍拦住提交。
        if: always() && steps.gate.outputs.skip != 'true' && steps.quality.outcome != 'failure' && steps.annotate.outcome == 'success'
        run: |
          bash .github/scripts/commit_data.sh "chore(data): quality check + suffix filling ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
