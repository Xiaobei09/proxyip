name: China check

on:
  workflow_dispatch:
  schedule:
    # 独立心跳：每小时一轮（与 update-proxies 的 :00 错开到 :11）。
    # streak 依赖"连续多轮可达"，此前仅挂在 quality-check 成功之后，
    # 任一上游失败或 IP 长期未变更都会冻结 stable 累积——故必须独立定时。
    # 与链式触发并存时由竞态检查去重（旧排队运行自动让位最新）。
    - cron: "11 * * * *"
  workflow_run:
    workflows: ["Quality check"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: china-check
  cancel-in-progress: false

jobs:
  check:
    name: Mainland-China reachability
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CHINA_CHECK_API_KEY: ${{ secrets.CHINA_CHECK_API_KEY }}
      TCPPING_CN_TOKEN: ${{ secrets.TCPPING_CN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Skip if superseded or no data change
        id: gate
        run: |
          # 1. 竞态检查
          LATEST=$(gh run list --workflow="${{ github.workflow }}" \
            --json=databaseId,status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")]
                   | sort_by(.databaseId) | last | .databaseId // empty' 2>/dev/null || echo "")
          if [ -n "$LATEST" ] && [ "$LATEST" != "${{ github.run_id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by run $LATEST, skipping"
            exit 0
          fi
          # 注：不因触发者(quality-check)失败而跳过——本工作流从仓库
          # checkout 的自洽数据运行（all.txt 与各 JSON 均为上次成功轮的
          # 完整快照），上游单次失败不应冻结 CN 连通性追踪(streak)
          # 与后缀应用，否则 IP 未变更期间 stable 永远无法累积。
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        if: steps.gate.outputs.skip != 'true'
        run: python -m unittest discover -s tests -v

      - name: China reachability check
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/china_check.py --source data/valid/all.txt --limit 0

      - name: Annotate and classify
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/annotate_classify.py

      - name: Build good lists
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/build_good.py

      - name: Generate stats and chart
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/generate_stats.py

      - name: Show summary
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "China-reachable proxies:"
          wc -l data/valid/all_cn.txt 2>/dev/null || true
          echo "Verdict distribution:"
          jq -r '[.proxies[].verdict] | group_by(.) | map({(.[0]): length}) | add // empty' \
            data/quality/china.json 2>/dev/null || true

      - name: Commit changes
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -Af data/ ':(exclude)data/raw' ':(exclude)data/download' \
            ':(exclude)data/diff'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): reachability check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $i failed, reapplying local data on origin/main..."
            git fetch origin main || { sleep 5; continue; }
            git reset --mixed origin/main
            git add -Af data/ ':(exclude)data/raw' ':(exclude)data/download' \
              ':(exclude)data/diff'
            if git diff --cached --quiet; then
              echo "No changes to push"
              exit 0
            fi
            git commit -m "chore(data): reachability check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          done
          echo "Push failed after 5 attempts"
          exit 1
