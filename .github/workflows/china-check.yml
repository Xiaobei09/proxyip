name: China check

on:
  workflow_dispatch:
  schedule:
    # 独立心跳：每小时一轮（与 update-proxies 的 :00 错开到 :11）。
    # streak 依赖"连续多轮可达"，此前仅挂在 quality-check 成功之后，
    # 任一上游失败或 IP 长期未变更都会冻结 stable 累积——故必须独立定时。
    # 不再挂 workflow_run 链：实测 GitHub 在 cron 命中时若本工作流仍有
    # in_progress run 就不会再起新 run（旧 run 安然跑完）；而 workflow_run
    # 触发的新 run 会取消上一个 in_progress run（观测 3 次），导致
    # probe 永远跑不完、china.json 冻结。纯 schedule 驱动即可。
    - cron: "11 * * * *"

permissions:
  contents: write

concurrency:
  group: china-check
  cancel-in-progress: false

jobs:
  check:
    name: Mainland-China reachability
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CHINA_CHECK_API_KEY: ${{ secrets.CHINA_CHECK_API_KEY }}
      TCPPING_CN_TOKEN: ${{ secrets.TCPPING_CN_TOKEN }}
      # CI 必须真实检出 PCB；缺失即失败，禁止静默写成空源证据。
      PROXYIP_REQUIRE_PCB: "1"
      # 公开仓单 job 硬上限 6h；主探测最多占 4.5h，预留 1h 给回退与提交。
      CN_PRIMARY_TIMEOUT_SECONDS: 16200
      CN_FALLBACK_TIMEOUT_SECONDS: 3600
      CN_FALLBACK_LIMIT: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout PCB bundle (read-only, pinned)
        uses: actions/checkout@v7
        with:
          repository: Xiaobei09/PCB
          ref: b03dd6177adbeca511bbe9184a781127a76cf91b
          token: ${{ secrets.BUNDLE_PAT }}
          path: pcb

      - name: Mark job start
        run: touch .jobstart

      - name: Skip if superseded or no data change
        id: gate
        run: |
          # 1. 竞态检查
          LATEST=$(gh run list --workflow="${{ github.workflow }}" \
            --json=databaseId,status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")]
                   | sort_by(.databaseId) | last | .databaseId // empty' 2>/dev/null || echo "")
          if [ -n "$LATEST" ] && [ "$LATEST" != "${{ github.run_id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by run $LATEST, skipping"
            exit 0
          fi
          # 注：本工作流纯 schedule 驱动（每小时 11 分自启，见上），无
          # workflow_run 触发者，故不存在"触发者失败时跳过"的判定；从仓库
          # checkout 的自洽数据运行（all.txt 与各 JSON 均为上次成功轮的
          # 完整快照），单次失败不冻结 CN 连通性追踪(streak)与后缀应用，
          # 否则 IP 未变更期间 stable 永远无法累积。
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        if: steps.gate.outputs.skip != 'true'
        run: python -m unittest discover -s tests -v

      - name: China reachability check
        id: china
        if: steps.gate.outputs.skip != 'true'
        run: |
          set +e
          timeout --signal=TERM --kill-after=120s "${CN_PRIMARY_TIMEOUT_SECONDS}s" \
            python scripts/china_check.py \
            --source data/valid/all.txt --limit 0 \
            --cn-limit src_2vIN9qi30DaRHJDtIR8zxw=800 --cn-concurrency src_2vIN9qi30DaRHJDtIR8zxw=20 \
            --cn-limit src_aAjqGkeptP-Fc9Vk2o0bBw=400 --cn-concurrency src_aAjqGkeptP-Fc9Vk2o0bBw=20 \
            --cn-limit src_kuveKnlgATFu4bT1vaavdQ=200 --cn-concurrency src_kuveKnlgATFu4bT1vaavdQ=8 \
            --cn-limit src_l_ifdbxx-IXHJGo5vZz2bw=200 --cn-concurrency src_l_ifdbxx-IXHJGo5vZz2bw=6 \
            --cn-limit src_VppzWrVKeanuwc20xQHV5w=1200 --cn-concurrency src_VppzWrVKeanuwc20xQHV5w=40 \
            --cn-limit src_auWhVNnk2BHJqQkixylvnQ=600 --cn-concurrency src_auWhVNnk2BHJqQkixylvnQ=12 \
            --cn-limit src_rbNxV-AzA5vWhXU2ex0Hig=500 --cn-concurrency src_rbNxV-AzA5vWhXU2ex0Hig=8 \
            --cn-limit src_yNl_hUrcFERKbVfruEd7bQ=200 --cn-concurrency src_yNl_hUrcFERKbVfruEd7bQ=8 \
            --cn-limit src_se0UGS5K317N6_dd1tbmiQ=400 --cn-concurrency src_se0UGS5K317N6_dd1tbmiQ=8 \
            --cn-limit src_urfBWidA4mIIdDF5bCmkLg=200 --cn-concurrency src_urfBWidA4mIIdDF5bCmkLg=6 \
            --cn-limit src_tYewH0QHze90tsMUm9ytaw=200 --cn-concurrency src_tYewH0QHze90tsMUm9ytaw=6 \
            --cn-limit src_zJZRP1CmcQ_JLqNrNXVsiQ=200 --cn-concurrency src_zJZRP1CmcQ_JLqNrNXVsiQ=8 \
            --cn-limit src_lp8y2sH8a0G-9EKTlmPq6A=200 --cn-concurrency src_lp8y2sH8a0G-9EKTlmPq6A=6 \
            --cn-limit src_1hR0HtwyaXBY-rGBpLeDjw=200 --cn-concurrency src_1hR0HtwyaXBY-rGBpLeDjw=6 \
            --cn-limit src_8PKN4eJiV9APK0Vg7q6Sxw=200 --cn-concurrency src_8PKN4eJiV9APK0Vg7q6Sxw=8 \
            --cn-limit src_m5aHuhSQrxDlNEgOW6cAkw=200 --cn-concurrency src_m5aHuhSQrxDlNEgOW6cAkw=8 \
            --cn-limit src_2sO2moK5b7pQd4502btrRw=200 --cn-concurrency src_2sO2moK5b7pQd4502btrRw=6 \
            --cn-limit src_9O6S275HTghlv7FPmYj7HQ=200 --cn-concurrency src_9O6S275HTghlv7FPmYj7HQ=6 \
            --cn-limit src_Epl17m7olCxkvJTwFuD3dA=200 --cn-concurrency src_Epl17m7olCxkvJTwFuD3dA=6 \
            --cn-limit src_hdgS1C-xTzGi7biGFUHc5A=100 --cn-concurrency src_hdgS1C-xTzGi7biGFUHc5A=8 \
            --cn-limit src_8oube2-h3tkjK1YX_0v5Cw=100 --cn-concurrency src_8oube2-h3tkjK1YX_0v5Cw=8 \
            --cn-limit src_Edo4D2FehI3pJ6hfmJE_OA=60 --cn-concurrency src_Edo4D2FehI3pJ6hfmJE_OA=4 \
            --cn-limit src_PAN_q6nWfOGJQ6vLdFhAuw=40 --cn-concurrency src_PAN_q6nWfOGJQ6vLdFhAuw=4 \
            --cn-limit src_6q1Z2RD8NKi4dCSPP5c2kA=40 --cn-concurrency src_6q1Z2RD8NKi4dCSPP5c2kA=4 \
            --cn-limit src_ctChfPd9-63mtRo9AC3Fjw=40 --cn-concurrency src_ctChfPd9-63mtRo9AC3Fjw=4 \
            --cn-limit src_JPE-jB2QHsfMOeSkzUuWXQ=300 --cn-concurrency src_JPE-jB2QHsfMOeSkzUuWXQ=6 \
            --cn-cache-ttl 21600
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 143 ]; then
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
            echo "::warning::主 CN 探测达到 ${CN_PRIMARY_TIMEOUT_SECONDS}s 上限；转入 ${CN_FALLBACK_LIMIT} 条有界回退"
            find data -type f -name '*.tmp' -newer .jobstart -delete 2>/dev/null || true
            timeout --signal=TERM --kill-after=60s "${CN_FALLBACK_TIMEOUT_SECONDS}s" \
              python scripts/china_check.py \
              --source data/valid/all.txt \
              --limit "${CN_FALLBACK_LIMIT}" \
              --cn-cache-ttl 21600
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi

      - name: Annotate and classify
        id: annotate
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/annotate_classify.py

      # good 清单改由专职 build-good 工作流在本链成功后重建（单一写入者）

      # 图表/统计改由专职 stats 工作流在本链成功后统一重建（单一写入者）

      # 提交前护栏：数据产出后再校验 CN 视图不变式（good/premium 家族不得
      # 混入海外实测速度），防止陈旧/空 cn_ms 重建把纯 -XMB/s 提交进仓库；
      # 失败即中止，本 run 不提交（此前 tests 步先于数据改动执行，抓不到
      # 改后状态）。
      - name: Verify CN-view invariant
        id: verify
        if: steps.gate.outputs.skip != 'true' && steps.annotate.outcome == 'success'
        run: >-
          python -m unittest
          tests.test_build_good.TestCommittedCnViewInvariant.test_no_plain_overseas_speed_in_good_premium
        env:
          PYTHONPATH: "."

      - name: Show summary
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "China check mode: ${{ steps.china.outputs.mode || 'full' }}"
          echo "China-reachable proxies:"
          wc -l data/valid/all_cn.txt 2>/dev/null || true
          echo "Verdict distribution:"
          jq -r '[.proxies[].verdict] | group_by(.) | map({(.[0]): length}) | add // empty' \
            data/quality/china.json 2>/dev/null || true

      - name: Commit changes
        if: steps.gate.outputs.skip != 'true' && steps.china.outcome == 'success' && steps.annotate.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          bash .github/scripts/commit_data.sh "chore(data): reachability check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
