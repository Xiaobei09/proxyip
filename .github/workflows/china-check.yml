name: China check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: china-check
  cancel-in-progress: true

jobs:
  check:
    name: Mainland-China reachability
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CHINA_CHECK_API_KEY: ${{ secrets.CHINA_CHECK_API_KEY }}
      TCPPING_CN_TOKEN: ${{ secrets.TCPPING_CN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: China reachability check
        run: python scripts/china_check.py --source data/valid/all.txt --limit 0

      - name: Show summary
        run: |
          echo "China-reachable proxies:"
          wc -l data/valid/all_cn.txt 2>/dev/null || true
          echo "Verdict distribution:"
          jq -r '[.proxies[].verdict] | group_by(.) | map({(.[0]): length}) | add // empty' \
            data/valid/china.json 2>/dev/null || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -Af data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): mainland-china reachability check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $i failed, reapplying local data on origin/main..."
            git fetch origin main || { sleep 5; continue; }
            # data/ 每次全量重生成，last-writer-wins 安全：reset --soft 把 HEAD 移到
            # 最新远端（工作区保留本次生成的数据），再重新 stage + commit 为直接子提交，
            # 天然避免 -X theirs 无法解决的 modify/delete 等一切冲突。
            git reset --soft origin/main
            git add -Af data/
            if git diff --cached --quiet; then
              echo "No changes to push"
              exit 0
            fi
            git commit -m "chore(data): mainland-china reachability check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          done
          echo "Push failed after 5 attempts"
          exit 1
