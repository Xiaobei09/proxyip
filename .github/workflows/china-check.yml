name: China check

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Quality check"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: china-check
  cancel-in-progress: false

jobs:
  check:
    name: Mainland-China reachability
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CHINA_CHECK_API_KEY: ${{ secrets.CHINA_CHECK_API_KEY }}
      TCPPING_CN_TOKEN: ${{ secrets.TCPPING_CN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Skip if superseded or no data change
        id: gate
        run: |
          # 1. 竞态检查
          LATEST=$(gh run list --workflow="${{ github.workflow }}" \
            --json=databaseId,status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")]
                   | sort_by(.databaseId) | last | .databaseId // empty' 2>/dev/null || echo "")
          if [ -n "$LATEST" ] && [ "$LATEST" != "${{ github.run_id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by run $LATEST, skipping"
            exit 0
          fi
          # 2. 触发者成功检查
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            if [ "$CONCLUSION" != "success" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Triggering run concluded: $CONCLUSION, skipping"
              exit 0
            fi
          fi
          # 3. 数据变更检查：上游有新提交但本工作流尚未处理则运行
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            LAST_UPSTREAM=$(git log --oneline -1 --fixed-strings --grep="chore(data): quality check" --format=%H 2>/dev/null || echo "")
            LAST_DOWNSTREAM=$(git log --oneline -1 --fixed-strings --grep="chore(data): reachability check" --format=%H 2>/dev/null || echo "")
            if [ -n "$LAST_UPSTREAM" ] && [ -n "$LAST_DOWNSTREAM" ]; then
              if git merge-base --is-ancestor "$LAST_UPSTREAM" "$LAST_DOWNSTREAM" 2>/dev/null; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "::notice::No new quality data since last reachability check, skipping"
              fi
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        if: steps.gate.outputs.skip != 'true'
        run: python -m unittest discover -s tests -v

      - name: China reachability check
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/china_check.py --source data/valid/all.txt --limit 0

      - name: Annotate and classify
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/annotate_classify.py

      - name: Show summary
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "China-reachable proxies:"
          wc -l data/valid/all_cn.txt 2>/dev/null || true
          echo "Verdict distribution:"
          jq -r '[.proxies[].verdict] | group_by(.) | map({(.[0]): length}) | add // empty' \
            data/quality/china.json 2>/dev/null || true

      - name: Commit changes
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -Af data/ ':(exclude)data/raw' ':(exclude)data/download' \
            ':(exclude)data/output' ':(exclude)data/diff'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
            git commit -m "chore(data): reachability check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $i failed, reapplying local data on origin/main..."
            git fetch origin main || { sleep 5; continue; }
            git reset --mixed origin/main
            git add -Af data/ ':(exclude)data/raw' ':(exclude)data/download' \
              ':(exclude)data/output' ':(exclude)data/diff'
            if git diff --cached --quiet; then
              echo "No changes to push"
              exit 0
            fi
          git commit -m "chore(data): reachability check ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          done
          echo "Push failed after 5 attempts"
          exit 1
