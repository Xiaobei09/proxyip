name: Annotate and classify

on:
  workflow_run:
    workflows: ["Quality check"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annotate-classify
  cancel-in-progress: false

jobs:
  annotate:
    name: Suffix filling & node classification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark job start
        run: touch .jobstart

      - name: Skip if superseded or no data change
        id: gate
        run: |
          # 1. 竞态检查
          LATEST=$(gh run list --workflow="${{ github.workflow }}" \
            --json=databaseId,status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")]
                   | sort_by(.databaseId) | last | .databaseId // empty' 2>/dev/null || echo "")
          if [ -n "$LATEST" ] && [ "$LATEST" != "${{ github.run_id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by run $LATEST, skipping"
            exit 0
          fi
          # 注：不因触发者(quality-check)失败而跳过——本工作流从仓库
          # checkout 的自洽数据运行（all.txt 与各 JSON 均为上次成功轮的
          # 完整快照），上游单次失败不应冻结 CN 连通性追踪(streak)
          # 与后缀应用，否则 IP 未变更期间 stable 永远无法累积。
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        if: steps.gate.outputs.skip != 'true'
        run: python -m unittest discover -s tests -v

      - name: Annotate and classify
        id: annotate
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/annotate_classify.py

      - name: Build good lists
        id: build
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/build_good.py

      # 提交前护栏：构建产物必须通过 CN 视图不变式（good/premium 家族不得
      # 混入海外实测 -XMB/s）。tests 步先于数据改动执行、抓不到改后状态，
      # 此处对已落盘数据校验，失败即中止不再提交。
      - name: Verify CN-view invariant
        id: verify
        if: steps.gate.outputs.skip != 'true' && steps.build.outcome == 'success'
        run: >-
          python -m unittest
          tests.test_build_good.TestCommittedCnViewInvariant.test_no_plain_overseas_speed_in_good_premium
        env:
          PYTHONPATH: "."

      - name: Show summary
        if: success() && steps.gate.outputs.skip != 'true'
        run: |
          echo "Annotated lines:"
          wc -l data/valid/all.txt
          echo "IP type distribution:"
          grep -oP '(?<=-)(DC|RES|MOB|PROXY)(?=-|$)' data/valid/all_ltd.txt 2>/dev/null | sort | uniq -c | sort -rn || true
          echo "Speed tier distribution:"
          grep -oP '(?<=-)(fast|mid|slow)(?=-|$)' data/valid/all_ltd.txt 2>/dev/null | sort | uniq -c | sort -rn || true

      - name: Commit changes
        # 闸门：仅当 annotate/build_good + CN 视图护栏均成功才提交——否则部分
        # 写入的 data/valid/*.txt 与 good 清单会被推入库（自定义 if 会顶掉默认
        # success()，须显式恢复）
        if: success() && steps.gate.outputs.skip != 'true' && steps.annotate.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          bash .github/scripts/commit_data.sh "chore(data): suffix filling & node classification ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
