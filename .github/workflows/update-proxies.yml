name: Update proxy list

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/download_proxies.py"

permissions:
  contents: write

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  update:
    name: Download and extract proxies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and extract
        run: python scripts/download_proxies.py

      - name: Show stats
        run: |
          echo "Files extracted:"
          find data/raw -name '*.txt' | wc -l
          echo "Country files:"
          find data/countries -name '*.txt' | wc -l
          echo "Port files:"
          find data/ports -name '*.txt' | wc -l
          echo "Unique IPs:"
          wc -l data/all.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): update proxy list ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
