name: Update proxy list

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/*.py"

permissions:
  contents: write

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  update:
    name: Download and extract proxies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Download and extract
        run: python scripts/download_proxies.py

      - name: Validate proxies
        run: python scripts/validate_proxies.py

      - name: Generate stats and chart
        run: python scripts/generate_stats.py

      - name: Show stats
        run: |
          echo "Files extracted:"
          find data/raw -name '*.txt' | wc -l
          echo "Country files:"
          find data/countries -name '*.txt' | wc -l
          echo "Port files:"
          find data/ports -name '*.txt' | wc -l
          echo "Unique IPs:"
          wc -l data/all.txt
          echo "Alive proxies:"
          wc -l data/valid/all.txt
          echo "History records:"
          wc -l data/history.jsonl
          echo "Diff archives:"
          ls data/diff/*.json 2>/dev/null | wc -l

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): update proxy list ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $i failed, rebasing on origin/main and retrying..."
            git fetch origin main || break
            # -X theirs: on conflict with concurrent data commits, prefer the
            # freshly generated data from this run (last-writer-wins is safe
            # because data/ is fully regenerated on every run).
            git rebase --autostash -X theirs origin/main || {
              echo "Rebase failed, aborting and retrying"
              git rebase --abort
            }
          done
          echo "Push failed after 5 attempts"
          exit 1
