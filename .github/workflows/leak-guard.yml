name: Leak guard

# 私有包防泄漏门禁的**唯一专职执行点**。
#
# 背景（R219 审计）：workflow 中只有 china-check / quality-check /
# update-proxies 检出私有包，而公开测试中的防泄漏门禁
# （pcb/tests_pipeline/test_checks_bundle.py；用例数会随门禁增删变化，**此处刻意不写死**
# ——R422 实测此前写死的「共 11 例」是**类数**而非例数，真实例数与之差
# 3 倍以上）在**无包环境会静默跳过多数用例**（同样随增删变化，故不写死；
# CI 摘要步从实跑输出派生真实数字）。于是下列 workflow 的「Run tests」
# 对泄漏完全无感——真名/端点字面可以无声回归而 CI 全绿。R218 修好的
# 分段扫描门禁因此只在部分链路上生效，覆盖面与它宣称的不符。
#
# 无感链路清单：**空**。R490 切流时给余下 5 条链路补上了
# `Checkout PCB bundle (read-only, tracking main)`，覆盖面从 4/9 变成 9/9，
# 「对泄漏无感」这一类 workflow 不再存在。
# 判据随之**升级**：test_checks_bundle 的
# test_workflow_bundle_checkout_coverage 不再核对「注释点名的清单」，
# 改为**直接要求未检出集合为空**（升级而非放宽：任何新增的、忘记加
# 检出的 workflow 仍会转红）。故本注释块内**不得再出现 .yml 文件名**——
# 残留名字即为过期声明，会被那条用例判红。
#
# 设计取舍：不向上述 workflow 逐个加检出。actions/checkout 检出私有
# 仓依赖 BUNDLE_PAT；secret 缺失时该步会硬失败，把「缺 secret」变成
# 红 job（违反硬性约束 5：缺 secret 必须降级而非崩溃），且多处重复
# 配置易漂移（正是 R219 pin 部分推进那类事故的温床）。故独立成 job：
# 单一配置、失败域隔离、零 secret 时显式降级。
#
# 本工作流**只读**：不写 data/、不提交、不需要 contents: write，
# 因此不参与 workflow_run 链，不影响既有顺序与 concurrency 组。

on:
  push:
    branches: [main]
    # R489：``scripts/`` 与 ``tests/`` 已随切流迁入私有仓，公开树不再有这两
    # 条路径 ⇒ 留着它们只是**永不可达的触发条件**（push 永远不会命中），
    # 看着像在守、实则不守。已删除，公开面只保留真实存在的路径。
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/**"
      - ".github/scripts/**"
  schedule:
    # 与数据链的每小时 tick 对齐（错开整点，取 47 分避开机器人拥塞）。
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leak-guard
  cancel-in-progress: true

jobs:
  guard:
    name: Private-source leak guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 显式探测而非在 checkout 上挂 if：把「有没有 secret」变成可读的
      # job 输出，降级路径对人和日志都可见，杜绝又一次静默跳过。
      - name: Detect bundle token
        id: detect
        env:
          BUNDLE_PAT_PRESENT: ${{ secrets.BUNDLE_PAT != '' }}
        run: |
          if [ "$BUNDLE_PAT_PRESENT" = "true" ]; then
            echo "has_bundle=true" >> "$GITHUB_OUTPUT"
            echo "bundle token present: guard will run in full"
          else
            echo "has_bundle=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BUNDLE_PAT 未配置——防泄漏门禁降级为仅公开侧断言（端点/真名模式清单在私有包内，无包不可得）"
          fi
          # 摘要里回显的 ref **从本文件派生**，不手写：手写标签会随 ref 改动
          # 而静默过期（R866 摘掉硬编码的「pinned」时发现的同类问题）。
          # 与本文件既有哲学一致——门禁数字一律派生，不写死。
          pcb_ref="$(awk '/repository: Xiaobei09\/PCB/{f=1} f&&/ref:/{sub(/^[^:]*:[[:space:]]*/,""); print; exit}' "$GITHUB_WORKSPACE/.github/workflows/leak-guard.yml")"
          echo "pcb_ref=${pcb_ref:-unknown}" >> "$GITHUB_OUTPUT"

      # pin 必须与另外三个检出私有包的 workflow 完全一致
      # （pcb/tests_pipeline/test_commit_data.py::TestPrivateBundlePinConsistency 锁定）。
      - name: Checkout PCB bundle (read-only, tracking main)
        if: steps.detect.outputs.has_bundle == 'true'
        uses: actions/checkout@v7
        with:
          repository: Xiaobei09/PCB
          ref: main
          token: ${{ secrets.BUNDLE_PAT }}
          path: pcb

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # R422：实跑数字经 **step outputs** 传给下方摘要步。
      # ⚠ `| tee` 会**掩盖退出码**（实测 `bash -e -c 'false | tee /dev/null'`
      # 返回 0），而本 workflow 的 `run:` 未指定 shell ⇒ 默认 `bash -e {0}`，
      # **不含 pipefail**。故必须显式 `set -o pipefail`，否则门禁红了这一步照样绿。
      # R438：本步把实跑数字经 **step outputs** 传给摘要步。此前摘要步回读日志
      # 文件，而承载该路径的变量只能声明在**工作流级** `env:`——那里按 GitHub
      # 上下文可用性表**不允许 `runner`**（仅 github/secrets/inputs/vars），属工作流
      # **校验期**错误：GitHub 拒绝创建任何 job。实测 R424/R428/R435/R436/R437
      # 五次 push 全部 0 job / 0s 挂掉 ⇒ 私有源泄漏门禁与提交格式门禁双双
      # **静默失效五轮**。摘要步改读 `steps.run_guard.outputs.*` 后，跨步共享
      # 路径这一根因整体消失，工作流级 `env:` 得以删除。
      - name: Run leak guard
        id: run_guard
        run: |
          set -o pipefail
          # 落 CI 临时目录而非仓库工作区，以免在工作区留下未跟踪文件。
          # 路径在**本步内**定义即可：bash 变量无需任何表达式上下文，`$RUNNER_TEMP`
          # 是 runner 自带环境变量。跨步共享路径这一根因已由 GITHUB_OUTPUT 消除
          # （摘要步读 steps.run_guard.outputs，不再回读本文件）。
          # ⚠ 必须是 `| tee`（管道）而**不是** `> >(tee …)`（进程替换）：bash 对
          # 进程替换**不等待**其消费端，紧随其后的 `grep "$log"` 会读到**半截**
          # 日志 ⇒ 摘要数字随机漂成 "?"。实测：写入端 20 行、消费者每行 sleep
          # 50ms 时，进程替换形式当场只读到 1 行；管道形式则必然等到写完。
          log="${RUNNER_TEMP}/leak-guard.log"
          python -m unittest pcb.tests_pipeline.test_checks_bundle -v 2>&1 | tee "$log"
          # 摘要数字**从日志派生**（不写死，随门禁增删自动跟随）。
          #
          # ⚠ R439：两条 grep 都必须显式吞掉「无匹配」的退出码，否则门禁
          #   **全绿也照样让本步 exit 1**。实测 CI run 36557608691：日志末尾
          #   `Ran 43 tests in 13.063s` / `OK`，紧接着
          #   `##[error]Process completed with exit code 1`。
          #   机理三段叠加：①无 skip 时 unittest 只打印 `OK`（**不带**
          #   `(skipped=N)`）⇒ `grep -oP 'skipped=\K\d+'` 无匹配退 1；
          #   ②`set -o pipefail` 让管道继承这个 1；③`run:` 未指定 shell ⇒
          #   默认 `bash -e {0}`，errexit 在**赋值式命令替换**上直接中止脚本。
          #   ★**失效方向是反的**：私有包在（=健康全量跑）⇒ 0 skip ⇒ 必炸；
          #     包不在（=降级跑）⇒ 33 skip ⇒ grep 命中 ⇒ 反而安然无恙。
          #     即「守卫越尽职越容易挂」，且 R422–R437 门禁 0 job 期间
          #     这段代码**一次都没被执行过**，缺陷因此被静默藏了五轮。
          #   `ran=` 同理：日志缺失/被截断时退 1，会让紧随其后的 `case`
          #   兜底**永远不可达**——即下面 R422 注释所写「日志缺失时如实报
          #   "?"，不失败」在旧代码里**根本没实现**。两条一并加 `|| true`，
          #   才让该兜底第一次真正可达（回归由
          #   pcb/tests_pipeline/test_commit_data.py::TestGuardSummaryParsingR439 以
          #   **行为**断言锁定——原样抽出本 run 块在 `bash -e` 下真跑，
          #   非文本匹配）。
          grep_count() { grep -oP "$1" "$log" 2>/dev/null | tail -1 || true; }
          ran=$(grep_count '^Ran \K\d+(?= tests?)')
          sk=$(grep_count 'skipped=\K\d+')
          [ -n "$sk" ] || sk=0
          # ⚠ 兜底必须连**算术**一起兜住：首版只把 ran 兜成 "?"，紧接的
          # $((ran - sk)) 在日志缺失时抛「operand expected」并因 `bash -e`
          # 让**摘要步失败**——等于给门禁造了一个新的红源。日志缺失时如实报
          # "?"，不失败（门禁本身的成败由本步决定，与摘要步无关）。
          case "$ran" in
            ''|*[!0-9]*) eff="?" ;;
            *) eff=$((ran - sk)) ;;
          esac
          {
            echo "ran=$ran"
            echo "skipped=$sk"
            echo "effective=$eff"
          } >> "$GITHUB_OUTPUT"

      # R348：``pcb.tests_pipeline.test_build_good`` 里另有一份量**同一批**陈旧真名条目的
      # 棘轮（``sources[*].error`` 值），此前**不在本 workflow 的测试面**——
      # 于是 R347 只下调了 ``test_checks_bundle`` 那份（84→7）并在 CI 上转绿，
      # 这份仍停在 84，只在跑全量 discover 的工作流里才撞红。实测两份量到的
      # 实值同为 7。纳入此处，使「修了一份、另一份仍红且无人看见」不再可能。
      - name: Run leak guard (published data values)
        run: python -m unittest pcb.tests_pipeline.test_build_good -v

      # R422：原先这里写死「11 例；无包时 8 例 skip」，实测两者都是错的
      # （实为 39 例 / 无包时 33 例 skip —— 后者把「无包则仅 6 例真生效」的
      # 假绿风险低估了 4 倍）。硬编码数字必然漂移，故改为**从实跑输出派生**。
      # R438：数字改经 `steps.run_guard.outputs` 传递（不再回读日志文件）——
      # 跨步共享文件路径正是 R423 引入工作流级 `env:` 的根因（见上）。
      - name: Summarise guard coverage
        env:
          HAS_BUNDLE: ${{ steps.detect.outputs.has_bundle }}
          PCB_REF: ${{ steps.detect.outputs.pcb_ref }}
          GUARD_RAN: ${{ steps.run_guard.outputs.ran }}
          GUARD_SKIPPED: ${{ steps.run_guard.outputs.skipped }}
          GUARD_EFFECTIVE: ${{ steps.run_guard.outputs.effective }}
        run: |
          ran="$GUARD_RAN"
          sk="$GUARD_SKIPPED"
          eff="$GUARD_EFFECTIVE"
          {
            echo "### 私有源泄漏门禁"
            echo ""
            if [ "$HAS_BUNDLE" = "true" ]; then
              echo "- 私有包：**已检出**（ref: $PCB_REF）→ 端点/真名/文档三类禁区全量生效"
            else
              echo "- 私有包：**缺 BUNDLE_PAT** → 模式清单不可得，仅公开侧断言生效"
            fi
            echo "- 门禁用例：\`pcb/tests_pipeline/test_checks_bundle\`（本次实跑 $ran 例，其中 $sk 例 skip ⇒ 实际生效 $eff 例）"
            echo "  （数字由上一步输出派生，非手写，不会随门禁增删而失真）"
          } >> "$GITHUB_STEP_SUMMARY"

  # R235：提交格式门禁的**专职执行点**。
  #
  # 事故：R235 的一次提交标题末尾漏了空格（"……[R235]"，门禁要求 `[` 前有
  # 空格），本地 `pcb.tests_pipeline.test_commit_data` 报红——但我**先 push 后看测试**，
  # 且 push 时 CI 全绿。原因：`test_commit_data` 只被 update-proxies /
  # china-check / quality-check 的全量「Run tests」覆盖，而那三个 workflow
  # 并**不保证在每次 push 上跑**（各自 schedule / workflow_run 触发）。
  # 于是「每次 push 都跑」的 leak-guard 当时只跑 `test_checks_bundle`，
  # 对提交格式**完全无感**——门禁的覆盖面与它宣称的不符（R219 审计同一类
  # 问题：名义覆盖 vs 实际覆盖）。
  #
  # 修法：独立 job 承载，`fetch-depth: 0` 以便历史检查能遍历提交
  # （浅克隆下 `git log` 只有 1 条，历史用例会平凡通过）。
  #
  # R514 修正一处**事实错误**：原注释写「**不需任何 secret**，故零 secret
  # 环境下也能生效——与 guard job 的降级策略无关」。但被调用的
  # `pcb.tests_pipeline.test_commit_data` 住在**私有包**里，而本 job
  # **从未检出私有包**（只有 `Checkout (full history)`）。
  # 实测后果：CI 连续三次 schedule 运行（最早 2026-09-29T16:38Z，**早于**
  # R510 推送）以这条报错失败——
  #   ModuleNotFoundError: No module named 'pcb.tests_pipeline'
  # ⇒ 这个 job **一次都没真正执行过门禁**，只是每次都红。而整个 workflow
  # 因此长红，把 job1 里真正在跑的 ``test_checks_bundle``（含 R510 新增的
  # 来源键结构门禁）的绿信号一起淹没——正是本仓反复吃过的
  # 「名义覆盖 vs 实际覆盖」。
  #
  # 修法：与 guard job **同构**——先显式探测 secret，检出挂在探测结果上；
  # 缺 secret 时**可见地**降级为跳过（``::warning::``），既不静默通过、
  # 也不硬失败。代价是本 job 不再「零 secret 也生效」；但它本就必须读私有
  # 包才能测，那个承诺从一开始就不成立。
  commit-format:
    name: Commit message format guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect bundle token
        id: detect
        env:
          BUNDLE_PAT_PRESENT: ${{ secrets.BUNDLE_PAT != '' }}
        run: |
          if [ "$BUNDLE_PAT_PRESENT" = "true" ]; then
            echo "has_bundle=true" >> "$GITHUB_OUTPUT"
            echo "bundle token present: commit-format guard will run"
          else
            echo "has_bundle=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BUNDLE_PAT 未配置——提交格式门禁降级为仅公开侧检出"
          fi

      # pin 必须与另外几个检出私有包的 workflow 完全一致
      # （pcb/tests_pipeline/test_commit_data.py::TestPrivateBundlePinConsistency 锁定）。
      - name: Checkout PCB bundle (read-only, tracking main)
        if: steps.detect.outputs.has_bundle == 'true'
        uses: actions/checkout@v7
        with:
          repository: Xiaobei09/PCB
          ref: main
          token: ${{ secrets.BUNDLE_PAT }}
          path: pcb

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Verify loop-commit message format
        if: steps.detect.outputs.has_bundle == 'true'
        run: python -m unittest pcb.tests_pipeline.test_commit_data -v

      - name: Report not executed (no bundle)
        if: steps.detect.outputs.has_bundle != 'true'
        run: |
          echo "::warning::未检出私有包 ⇒ 提交格式门禁**未执行**。缺席必须显示成 skip，不能显示成 OK。"

      - name: Summarize
        run: |
          {
            echo "### 提交格式门禁"
            echo ""
            echo "- 断言：轮次提交须为 \`<type>(<scope>): <摘要> [R<n>]\`"
            echo "- 执行点：**每次 push**（本 workflow），不再依赖全量 job 碰巧跑到"
          } >> "$GITHUB_STEP_SUMMARY"
