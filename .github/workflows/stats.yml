name: Stats and charts

on:
  workflow_dispatch:
  # 独立心跳：即使所有数据产出链（update/quality/china/exit/good）连续失败，
  # stats 仍每 2 小时运行一次，health_alert 得以对"全线死亡"发出 stale/池塌方
  # 告警（相同告警已被 6h 冷却抑制，不会刷屏）。错开到 update 的 :00/:02h。
  schedule:
    - cron: "40 */2 * * *"
  # 任一数据产出链成功后统一重建图表与 stats.json——单一写入者，
  # 此前 generate_stats 内嵌在 quality/china 两条链里重复执行。
  workflow_run:
    workflows: ["Quality check", "China check", "Exit family check", "Build good lists"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  render:
    name: Generate stats & SVG charts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark job start
        run: touch .jobstart

      - name: Skip if superseded or trigger failed
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] \
             && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(gh run list --workflow="${{ github.workflow }}" \
            --json=databaseId,status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")]
                   | sort_by(.databaseId) | last | .databaseId // empty' 2>/dev/null || echo "")
          if [ -n "$LATEST" ] && [ "$LATEST" != "${{ github.run_id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by run $LATEST, skipping"
            exit 0
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate stats and charts
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/generate_stats.py

      - name: Export structured JSON
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/export_json.py

      - name: Source quality analysis
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/analyze_sources.py

      - name: Health watchdog
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/health_alert.py

      - name: Commit changes
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash .github/scripts/commit_data.sh "chore(data): stats & charts ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

      # jsDelivr 的 @main 缓存不随仓库更新失效——README 图片会长期停留在
      # 旧版（曾出现空占位图被缓存数日）。提交后对本轮变更的产物逐个 purge。
      - name: Purge jsDelivr cache
        if: steps.gate.outputs.skip != 'true'
        run: |
          for f in $(git diff --name-only HEAD~1 -- data/output 2>/dev/null); do
            curl -sf -o /dev/null --max-time 15 \
              "https://purge.jsdelivr.net/gh/Xiaobei09/proxyip@main/$f" || true
          done
